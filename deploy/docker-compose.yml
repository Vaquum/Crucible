services:
  crucible:
    image: ${CRUCIBLE_IMAGE:?CRUCIBLE_IMAGE must be set}
    init: true
    environment:
      APP_USERNAME: ${APP_USERNAME:?APP_USERNAME must be set}
      APP_PASSWORD: ${APP_PASSWORD:?APP_PASSWORD must be set}
      API_SECRET: ${API_SECRET:?API_SECRET must be set}
      CRUCIBLE_HOST: 0.0.0.0
      CRUCIBLE_PORT: 8877
      CRUCIBLE_DATA_ROOT: /data/experiments/crucible
      CRUCIBLE_ARROW_DIR: /opt/arrow
      CRUCIBLE_SWEEP_ROOT: /data/experiments/experiments
    ports:
      - "127.0.0.1:${CRUCIBLE_PORT:-8877}:8877"
    volumes:
      - type: bind
        source: ${CRUCIBLE_HOST_DATA_ROOT:-/data/experiments}
        target: /data/experiments
        read_only: false
      # The tdw Arrow bar store, mounted read-only so klines load via Limen's
      # HistoricalData.get_arrow_file from /opt/arrow/<series>/latest.arrow —
      # the same pattern Furnace uses. external:true keeps this compose from
      # creating or deleting the shared volume; the tdw-control-plane stack owns it.
      - type: volume
        source: arrow
        target: /opt/arrow
        read_only: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8877/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  # External: this compose never creates or removes the shared bar store; the
  # tdw-control-plane stack produces it. Override the name with ARROW_VOLUME_NAME.
  arrow:
    external: true
    name: ${ARROW_VOLUME_NAME:-tdw-control-plane_arrow}
