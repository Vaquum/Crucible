<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crucible</title>
<style>:root{color-scheme:dark}html,body{background:#121212;margin:0}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/style.css?v=dark-1">
</head>
<body>
<header class="controls">
  <div class="control-row filter-row">
    <button id="dateToggle" class="icon-button" type="button" aria-label="Date range">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2v4M17 2v4M4 9h16M5 5h14a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Z"/></svg>
    </button>
    <div id="datePanel" class="date-panel" hidden>
      <div class="date-presets">
        <button type="button" data-date-preset="current-hour">Current hour</button>
        <button type="button" data-date-preset="last-hour">Last hour</button>
        <button type="button" data-date-preset="last-4-hours">Last 4 hrs</button>
      </div>
      <label>Start<input id="start" type="datetime-local" step="0.001"></label>
      <label>End<input id="end" type="datetime-local" step="0.001"></label>
    </div>
    <label><span>Fraction</span><input id="fraction" type="number" min="0.001" max="1" step="0.001" value="1"></label>
    <label><span>Bar</span><select id="barType"><option value="time" selected>time</option></select></label>
    <label><span>Groupby</span><select id="barInterval"><option value="0.125">125ms</option><option value="0.25">250ms</option><option value="0.5">500ms</option><option value="1">1s</option><option value="2">2s</option><option value="4">4s</option><option value="8">8s</option><option value="16">16s</option><option value="32">32s</option><option value="64">64s</option><option value="128">128s</option><option value="256">256s</option><option value="512">512s</option><option value="1024">1024s</option><option value="2048">2048s</option><option value="4096">4096s</option><option value="8192">8192s</option><option value="16384">16384s</option></select></label>
    <label><span>Groupby Func</span><select id="barFunction"><option value="rubric">rubric</option></select></label>
    <label>Grid<select id="grid"><option value="none">none</option><option value="day">day</option><option value="groupby">groupby</option></select></label>
  </div>
  <div class="control-row encoding-row">
    <div class="channel"><span>X</span><select id="xField"></select><label class="toggle" title="Log scale"><input id="xScale" type="checkbox"><span>Log</span></label><label class="toggle" title="Z-score outlier filter"><input id="xOutlier" type="checkbox"><span>Z</span></label></div>
    <div class="channel"><span>Y</span><select id="yField"></select><label class="toggle" title="Log scale"><input id="yScale" type="checkbox"><span>Log</span></label><label class="toggle" title="Z-score outlier filter"><input id="yOutlier" type="checkbox"><span>Z</span></label></div>
    <div class="channel"><span>Color</span><select id="colorField"></select><label class="toggle" title="Log scale"><input id="colorScale" type="checkbox"><span>Log</span></label><label class="toggle" title="Z-score outlier filter"><input id="colorOutlier" type="checkbox"><span>Z</span></label></div>
    <div class="channel"><span>Size</span><select id="sizeField"></select><label class="toggle" title="Log scale"><input id="sizeScale" type="checkbox"><span>Log</span></label><label class="toggle" title="Z-score outlier filter"><input id="sizeOutlier" type="checkbox"><span>Z</span></label></div>
  </div>
  <div class="control-row timeline-row">
    <button id="timelinePlay" class="icon-button play-button" type="button" aria-label="Play timeline" aria-pressed="false" title="Play timeline"><span id="timelinePlayIcon" aria-hidden="true">▶</span></button>
    <input id="timeline" type="range" min="0" max="0" step="1" value="0" aria-label="Timeline">
    <select id="timelineSpeed" aria-label="Timeline speed"><option value="1">1x</option><option value="2">2x</option><option value="4">4x</option><option value="8">8x</option><option value="16">16x</option><option value="32">32x</option></select>
  </div>
</header>
<main>
  <canvas id="chart"></canvas>
  <div id="tooltip" hidden></div>
  <output id="status">Loading</output>
</main>
<script src="assets/app.js?v=dark-1"></script>
</body>
</html>
